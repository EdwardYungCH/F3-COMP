  AX.register({
    id: 'NET2', code: 'NET2', mode: 'practice', full: 100, fileTag: '網絡單元二延伸', subject: '電腦網絡', logo: '🏠', appName: 'SOHO 網絡',

    intro: ['陳先生在家中開設工作室，你要為他的家建立一個 SOHO 網絡：書房的桌上電腦及打印機用網線；手提電腦、智能電話及網絡攝錄機用無線網絡。',
      'SOHO 網絡以「最少設備」為原則：想一想，哪一件設備可以同時做幾件設備的工作？'],

        h1: '數據機負責把模擬信號和數碼信號互相轉換，寬頻上網要經數據機連接互聯網。', h2: '設備架按「數據機」→ 按客廳放置 → 按「🔌 連線」→ 按「互聯網」再按數據機。',
        check: function (S) { return chain(S).mi; } },
      { title: '把路由器接到數據機', detail: '放置一部<b>路由器</b>（或<b>無線網絡路由器</b>），用網線接到數據機，讓家中的區域網絡連接到互聯網。',
        h1: 'SOHO 網絡以最少設備為原則：哪一件設備同時有路由器、交換器及無線網絡接達點的功能？', h2: '放置「無線網絡路由器」，再用「雙扭線 Cat 5e」接到數據機。',

      { title: '測試網絡：全部設備都可以使用網絡', detail: '按工具列的「<b>▶ 測試網絡</b>」。如有問題，下方會說明原因，請修改後再測試。',

        '<h4 style="margin-top:10px">🧰 設備功能</h4><table class="reft" style="text-align:left"><tr><td>數據機</td><td>轉換模擬／數碼信號，連接寬頻線路</td></tr><tr><td>路由器</td><td>把區域網絡連接到互聯網</td></tr><tr><td>交換器</td><td>連接區域網絡內的設備</td></tr><tr><td>無線網絡接達點</td><td>連繫有線和無線網絡</td></tr><tr><td>無線中繼站</td><td>接收並轉發無線訊號，擴大覆蓋範圍</td></tr></table>';

      var n = infraN(S), ok = allOk(S), g = !ok ? 0 : n <= 3 ? M.min : n === 4 ? M.min / 2 : 0;

      var q = L.quiz || { first: {} };

      if (L.links.some(function (l) { return l.cable === 'fiber'; })) notes.push('家居網絡距離很短，用雙扭線已足夠；光纖價格昂貴、安裝困難。');
      return { items: items, notes: notes };
    },
    reportExtra: function (st) {
      var L = st.lab; if (!L) return '';
      var E = AX.esc;
      return '<h2>三、網絡設備及連線</h2><div style="display:flex;gap:10px;font-size:11.5px"><div style="flex:1"><b>設備：</b>' +
        (L.devs.filter(function (d) { return !d.fixed; }).map(function (d) { return E(d.name) + '（' + E(NET.zname(SCEN, d.zone)) + '）'; }).join('、') || '（沒有）') + '</div><div style="flex:2"><b>連線：</b>' +
        (L.links.map(function (l) { var a = NET.dev(L, l.a), b = NET.dev(L, l.b), ok = NET.linkCheck(SCEN, L, l).ok; return E(a.name + '—' + b.name + '：' + NET.CABLES[l.cable].n) + (ok ? '' : ' ✘'); }).join('；') || '（沒有）') + '</div></div>';
    }
  });

  AX.CFG.NET2.lab = NET.lab(SCEN, {

  });
