<style>
/* =====================================================================
   Access 模擬練習 — 介面樣式
   ===================================================================== */
:root{
  --acc:#a4373a; --acc-d:#86292c; --acc-l:#f6e3e4; --acc-ll:#fbf2f2;
  --hdr:#1d3557; --hdr2:#274a73; --ok:#2e8b57; --ok-l:#e7f5ec; --warn:#b07800; --warn-l:#fff6dd; --bad:#c0392b; --bad-l:#fdecea;
  --ink:#1f2328; --mute:#5f6670; --line:#d5d9de; --bg:#e8ebef; --panel:#fff;
  --rb:#f3f3f3; --font:"Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;
}
.assess{--hdr:#4a1d22;--hdr2:#6a2a31}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
.ic{width:100%;height:100%;display:block}

/* ---------- 頂欄 ---------- */
#hdr{height:52px;background:linear-gradient(90deg,var(--hdr),var(--hdr2));color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;position:relative;z-index:5}
#hdr .logo{width:30px;height:30px;border-radius:7px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);flex:none}
#hdr .ttl{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#hdr .ttl small{display:block;font-weight:400;font-size:11.5px;opacity:.75}
#hdr .sp{flex:1}
.chip{font-size:12.5px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px;white-space:nowrap}
.chip b{font-weight:700}
#hdr .hb{border:0;border-radius:6px;padding:8px 13px;font-size:13px;background:rgba(255,255,255,.16);color:#fff;white-space:nowrap}
#hdr .hb:hover{background:rgba(255,255,255,.26)}
#hdr .hb.pri{background:var(--ok);font-weight:700;box-shadow:0 1px 0 rgba(0,0,0,.2)}
#hdr .hb.pri:hover{background:#277a4b}

/* ---------- 版面 ---------- */
#wrap{display:grid;grid-template-columns:minmax(0,1fr) 352px;height:calc(100vh - 52px)}
#left{min-width:0;padding:10px;display:flex}
#guide{background:#f6f7f9;border-left:1px solid var(--line);overflow:auto;padding:12px}

/* ---------- Access 視窗 ---------- */
#win{flex:1;display:flex;flex-direction:column;background:#fff;border:1px solid #8d8d8d;box-shadow:0 4px 18px rgba(0,0,0,.18);min-width:0;min-height:0;border-radius:3px;overflow:hidden}
#titlebar{background:var(--acc);color:#fff;height:32px;display:flex;align-items:center;padding:0 6px;font-size:12.5px;gap:8px;flex:none}
.qat{display:flex;gap:1px;align-items:center}
.qat button{width:28px;height:26px;border:0;background:none;color:#fff;padding:5px;border-radius:3px}
.qat button:hover{background:rgba(255,255,255,.2)}
.qat .sep{width:1px;height:16px;background:rgba(255,255,255,.35);margin:0 4px}
#tt{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wctl{display:flex;gap:0;font-size:13px}
.wctl span{width:34px;text-align:center;opacity:.9}
#tabsbar{background:var(--acc);display:flex;align-items:flex-end;padding:0 4px;flex:none;min-height:30px;overflow-x:auto}
.tab{color:#fff;padding:6px 14px 7px;font-size:13px;cursor:pointer;border-radius:3px 3px 0 0;white-space:nowrap;user-select:none}
.tab:hover{background:rgba(255,255,255,.15)}
.tab.on{background:var(--rb);color:var(--acc);font-weight:700}
.tab.file{background:var(--acc-d)}
.ctxgrp{display:flex;flex-direction:column;margin-left:8px}
.ctxgrp .cl{background:#f0c64a;color:#4a3800;font-size:11px;text-align:center;padding:1px 8px;border-radius:2px 2px 0 0;font-weight:700}
.ctxgrp .tab{border-top:2px solid #f0c64a;border-radius:0}
.ctxgrp .tab.on{border-top-color:#f0c64a}
#ribbon{background:var(--rb);border-bottom:1px solid #d2d2d2;display:flex;padding:3px 4px 0;min-height:94px;overflow-x:auto;overflow-y:hidden;flex:none}
.grp{display:flex;flex-direction:column;border-right:1px solid #dadada;padding:0 4px;flex:none}
.grp .gi{display:flex;gap:1px;align-items:flex-start;flex:1}
.grp .gn{text-align:center;font-size:11px;color:#666;padding:2px 0 3px;white-space:nowrap}
.rbB{border:1px solid transparent;background:none;border-radius:3px;min-width:54px;max-width:86px;width:auto;white-space:normal;word-break:keep-all;min-height:68px;padding:3px 2px;font-size:11.5px;line-height:1.2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.rbB .i{width:32px;height:32px;flex:none}
.rbS{border:1px solid transparent;background:none;border-radius:3px;display:flex;align-items:center;gap:4px;padding:2px 6px 2px 3px;font-size:11.5px;white-space:nowrap;height:22px}
.rbS .i{width:16px;height:16px;flex:none}
.col{display:flex;flex-direction:column;gap:0;padding-top:1px}
.rbB:hover,.rbS:hover{background:#fbe3e4;border-color:#e8b6b8}
.rbB.act{background:#f4c9cb;border-color:#c98488}
.split{display:flex;flex-direction:column;border:1px solid transparent;border-radius:3px;width:62px;min-height:68px}
.split:hover{border-color:#e8b6b8}
.split .top{border:0;background:none;padding:3px 2px 0;display:flex;justify-content:center;border-radius:3px 3px 0 0}
.split .top .i{width:32px;height:32px}
.split .bot{border:0;background:none;font-size:11.5px;padding:2px 0 3px;border-radius:0 0 3px 3px}
.split .top:hover,.split .bot:hover{background:#fbe3e4}
#wbody{flex:1;display:flex;min-height:0}
#nav{width:190px;background:#fff;border-right:1px solid #d2d2d2;font-size:12.5px;overflow:auto;flex:none;display:flex;flex-direction:column}
#nav .nh{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;font-weight:700;border-bottom:1px solid #e3e3e3;color:#333}
#nav .nh span{color:#888;font-weight:400}
#nav .srch{margin:6px 8px;border:1px solid #cfcfcf;padding:3px 6px;color:#999;font-size:12px;border-radius:2px}
#nav .ng{padding:5px 8px 3px;color:var(--acc);font-weight:700;display:flex;justify-content:space-between;border-top:1px solid #f0f0f0}
#nav .it{padding:4px 8px 4px 14px;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;-webkit-user-select:none}
#nav .it .i{width:16px;height:16px;flex:none}
#nav .it:hover{background:#fbe9ea}
#nav .it.on{background:#f4c9cb}
#nav .none{padding:3px 8px 3px 14px;color:#aaa}
#nav .navtip{margin-top:auto;padding:8px;font-size:11.5px;color:#888;border-top:1px solid #eee;line-height:1.5}
#doc{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
#doctabs{display:flex;background:#f3f3f3;border-bottom:1px solid #d2d2d2;font-size:12.5px;min-height:28px;flex:none}
#doctabs .dt{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;background:#fff;border:1px solid #d2d2d2;border-bottom:0;border-top:2px solid var(--acc);margin:2px 0 -1px 4px}
#doctabs .dt .i{width:15px;height:15px}
#doctabs .dt .x{border:0;background:none;width:20px;height:20px;border-radius:3px;color:#666;font-size:13px;line-height:1}
#doctabs .dt .x:hover{background:#fbe3e4;color:var(--bad)}
#docarea{flex:1;overflow:auto;position:relative;min-height:0}
#win.locked #ribbon,#win.locked #wbody,#win.locked #tabsbar{pointer-events:none;opacity:.7}
#status{height:26px;background:var(--acc);color:#fff;font-size:12px;display:flex;align-items:center;padding:0 8px;gap:8px;flex:none}
#status .sp{flex:1}
#stmsg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewbtns{display:flex;gap:2px}
#viewbtns button{width:24px;height:20px;border:0;background:none;border-radius:2px;padding:2px;color:#fff}
#viewbtns button .ic{filter:brightness(0) invert(1)}
#viewbtns button:hover{background:rgba(255,255,255,.25)}
#viewbtns button.on{background:rgba(255,255,255,.42)}
.empty{padding:40px 30px;color:#666;line-height:1.9;font-size:14px}
.empty b{color:var(--ink)}

/* ---------- 開始畫面(後台) ---------- */
.bs{display:flex;flex:1;min-height:0}
.bs .side{width:200px;background:var(--acc);color:#fff;padding:18px 0;flex:none}
.bs .side h2{font-weight:300;font-size:30px;margin:0 22px 22px}
.bs .side div{padding:9px 22px;font-size:14px;cursor:pointer}
.bs .side div:hover{background:rgba(255,255,255,.15)}
.bs .side div.on{background:var(--acc-d)}
.bs .main{flex:1;padding:22px 28px;overflow:auto;background:#fff}
.bs .main h3{font-weight:400;font-size:22px;margin:0 0 16px;color:#333}
.tiles{display:flex;flex-wrap:wrap;gap:16px}
.tile{width:168px;cursor:pointer;border:1px solid transparent;padding:6px;border-radius:3px}
.tile:hover{background:var(--acc-ll);border-color:#e8b6b8}
.tile .pv{height:150px;border:1px solid #ccc;background:#fafafa;display:flex;align-items:center;justify-content:center}
.tile .pv .i{width:64px;height:64px}
.tile .lb{font-size:13px;margin-top:6px}

/* ---------- 設計檢視 ---------- */
.dv{display:flex;flex-direction:column;height:100%}
.dv .top{flex:1;overflow:auto;min-height:150px}
table.dg{border-collapse:collapse;width:100%;font-size:13px}
table.dg th{background:#f3f3f3;border:1px solid #d6d6d6;padding:5px 6px;font-weight:400;text-align:left;position:sticky;top:0;z-index:1}
table.dg td{border:1px solid #e0e0e0;padding:0;height:26px}
table.dg td.rs{width:26px;text-align:center;background:#f3f3f3;cursor:pointer;border-color:#d6d6d6}
table.dg td.rs .i{width:16px;height:16px;display:inline-block;vertical-align:middle}
table.dg tr.sel td{background:#fdf3d1}
table.dg tr.sel td.rs{background:#f4c9cb}
table.dg input,table.dg select{width:100%;border:0;padding:4px 6px;font-size:13px;background:transparent;height:26px}
table.dg input:focus,table.dg select:focus{outline:2px solid #e3a33a;outline-offset:-2px;background:#fffbe8}
.props{border-top:3px solid #c8c8c8;background:#fff;display:flex;flex:none;max-height:46%;overflow:auto}
.props .pl{flex:1;min-width:0;padding:4px 8px 8px}
.props .ptabs{display:flex;gap:2px;margin:2px 0 4px;font-size:12.5px}
.props .ptabs span{padding:3px 12px;border:1px solid #ccc;border-bottom:0;background:#f3f3f3}
.props .ptabs span.on{background:#fff;font-weight:700}
.props .pttl{font-size:12px;color:#666;margin:2px 0 4px}
.props table{border-collapse:collapse;width:100%;max-width:560px;font-size:12.5px}
.props td{border:1px solid #e0e0e0;padding:2px 6px;height:24px}
.props td.k{width:150px;background:#fafafa;color:#333}
.props td .ro{color:#999}
.props input,.props select{width:100%;border:1px solid #9ab;padding:2px 4px;font-size:12.5px;height:22px}
.props input:focus,.props select:focus{outline:2px solid #e3a33a;background:#fffbe8}
.props .ph{width:240px;flex:none;padding:12px;font-size:12px;color:#555;line-height:1.6;border-left:1px solid #eee;background:#fafafa}

/* ---------- 資料工作表 ---------- */
.dsv{display:flex;flex-direction:column;height:100%}
.dsv .top{flex:1;overflow:auto}
table.ds{border-collapse:collapse;font-size:13px}
table.ds th{background:#f3f3f3;border:1px solid #d0d0d0;padding:5px 8px;font-weight:400;text-align:left;min-width:110px;white-space:nowrap;position:sticky;top:0;z-index:1}
table.ds th.add{color:#888;font-style:italic;min-width:120px}
table.ds td{border:1px solid #e0e0e0;padding:0;height:26px;background:#fff}
table.ds td.rs{width:24px;min-width:24px;text-align:center;background:#f3f3f3;cursor:pointer;color:var(--acc);border-color:#d0d0d0;font-size:12px}
table.ds tr.sel td{background:#fdf3d1}
table.ds tr.sel td.rs{background:#f4c9cb}
table.ds tr.nr td{background:#fbfbfb}
table.ds input[type=text]{width:100%;min-width:110px;border:0;padding:4px 8px;font-size:13px;background:transparent;height:26px}
table.ds input:focus{outline:2px solid #e3a33a;outline-offset:-2px;background:#fffbe8}
table.ds input.num{text-align:right}
table.ds input[readonly]{color:#777}
table.ds td.ck{text-align:center}
table.ds td.ck input{width:16px;height:16px;margin:4px}
.recnav{display:flex;align-items:center;gap:3px;border-top:1px solid #d0d0d0;background:#f3f3f3;font-size:12px;padding:2px 6px;flex:none;flex-wrap:wrap}
.recnav button{border:1px solid transparent;background:none;padding:1px 6px;border-radius:2px;font-size:12px;min-width:24px}
.recnav button:hover{background:#fbe3e4;border-color:#e8b6b8}
.recnav .pos{border:1px solid #bbb;background:#fff;padding:1px 8px;min-width:64px;text-align:center}
.recnav .nf{margin-left:10px;color:#888}
.dsnote{font-size:12px;color:#777;padding:6px 8px}

/* ---------- 表單檢視 ---------- */
.fvw{display:flex;flex-direction:column;height:100%}
.fvw .top{flex:1;overflow:auto;padding:14px;background:#fafafa}
.fbox{background:#fff;border:1px solid #c9c9c9;max-width:560px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.fhd{background:linear-gradient(#3d6aa3,#2f5a91);color:#fff;padding:12px 16px;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.fhd .i{width:26px;height:26px;background:#fff;border-radius:3px;padding:2px}
.fbody{padding:12px 16px}
.frow{display:flex;align-items:center;padding:4px 0;gap:10px}
.frow .lb{width:92px;font-size:13px;color:#333;text-align:right;flex:none;background:#eef2f7;padding:5px 8px;border:1px solid #d8dee6}
.frow input[type=text]{flex:1;padding:5px 8px;border:1px solid #9aa8b6;font-size:13.5px;background:#fff;height:30px}
.frow input.num{text-align:right}
.frow input[type=checkbox]{width:18px;height:18px}
.frow input:focus{outline:2px solid #e3a33a;background:#fffbe8}
.fbody.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* ---------- 對話框 ---------- */
#layer{position:fixed;inset:0;background:rgba(20,24,30,.35);display:none;align-items:center;justify-content:center;z-index:86;padding:12px}
.dlg{background:#fff;border:1px solid #777;box-shadow:0 10px 32px rgba(0,0,0,.35);min-width:min(360px,94vw);max-width:min(640px,96vw);max-height:94vh;display:flex;flex-direction:column}
.dlg .dh{background:#fff;color:#222;padding:8px 12px;font-size:13px;border-bottom:1px solid #e3e3e3;display:flex;justify-content:space-between;align-items:center}
.dlg .dh .x{border:0;background:none;font-size:15px;color:#666;width:26px;height:22px}
.dlg .dh .x:hover{background:var(--bad);color:#fff}
.dlg .db{padding:16px;font-size:13.5px;line-height:1.6;overflow:auto}
.dlg .db .warnic{float:left;width:36px;height:36px;border-radius:50%;background:#fde6b5;color:#8a5b00;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin:0 12px 6px 0}
.dlg .df{padding:10px 12px;display:flex;justify-content:flex-end;gap:8px;background:#f3f3f3;border-top:1px solid #e3e3e3}
.dlg .df button{min-width:84px;padding:5px 12px;border:1px solid #adadad;background:#e9e9e9;border-radius:2px;font-size:13px}
.dlg .df button:hover{background:#e5f1fb;border-color:#0078d7}
.dlg .df button.pri{border-color:#0078d7;box-shadow:inset 0 0 0 1px #0078d7}
.dlg .df button:disabled{color:#aaa;cursor:default;background:#f3f3f3;border-color:#ccc;box-shadow:none}
.dlg input[type=text]{width:100%;padding:5px 7px;font-size:13.5px;border:1px solid #7a7a7a}
.dlg input[type=text]:focus{outline:2px solid #0078d7;outline-offset:-1px}
.wizb{width:min(600px,92vw)}
.wizhead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.wizhead .i{width:40px;height:40px;flex:none}
.wizhead b{font-size:15px}
.wizrow{display:flex;gap:10px;align-items:stretch}
select.lst{width:100%;height:170px;font-size:13px;border:1px solid #7a7a7a}
.mvb{display:flex;flex-direction:column;gap:6px;justify-content:center}
.mvb button{width:46px;padding:4px 0;border:1px solid #adadad;background:#e9e9e9;border-radius:2px}
.mvb button:hover{background:#e5f1fb;border-color:#0078d7}
.lay label{display:block;margin:7px 0;font-size:13.5px;cursor:pointer}
.prev{flex:1;border:1px solid #aaa;background:#fff;padding:10px;min-height:170px}
.pv-r{display:flex;gap:4px;margin:4px 0}
.pv-r i{display:block;height:10px;flex:1;background:#cfd8e2;border:1px solid #b6c1cd}
.pv-r i.l{flex:none;width:52px;background:#eef2f6}
#ctx{position:fixed;background:#fff;border:1px solid #999;box-shadow:2px 4px 12px rgba(0,0,0,.25);z-index:60;display:none;font-size:13px;min-width:190px;padding:3px 0}
#ctx div{padding:6px 16px 6px 28px;cursor:pointer}
#ctx div:hover{background:#fbe3e4}
#ctx .sepx{height:1px;background:#ddd;margin:3px 0;padding:0;cursor:default}
#ctx div.b{font-weight:700}
.vmenu{position:fixed;background:#fff;border:1px solid #999;box-shadow:2px 4px 12px rgba(0,0,0,.25);z-index:60;font-size:13px;min-width:190px;padding:3px 0}
.vmenu div{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer}
.vmenu div .i{width:20px;height:20px}
.vmenu div:hover{background:#fbe3e4}

/* ---------- 指引欄 ---------- */
.gcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.gprog{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gprog .bar{flex:1;height:10px;background:#e3e7ec;border-radius:99px;overflow:hidden}
.gprog .bar i{display:block;height:100%;background:linear-gradient(90deg,#2e8b57,#4cb37a);border-radius:99px;transition:width .5s}
.gprog .t{font-size:12.5px;color:var(--mute);white-space:nowrap}
.gcur{border:2px solid var(--ok);background:var(--ok-l)}
.assess .gcur{border-color:#8a5a2b;background:#fbf4ec}
.gcur .k{font-size:12px;color:var(--ok);font-weight:700;letter-spacing:.5px;display:flex;justify-content:space-between}
.assess .gcur .k{color:#8a5a2b}
.gcur .h{font-size:16px;font-weight:700;margin:4px 0 6px;line-height:1.4}
.gcur .d{font-size:13px;line-height:1.7;color:#2b3036}
.gcur .d table{border-collapse:collapse;margin:4px 0;font-size:12.5px;background:#fff}
.gcur .d td,.gcur .d th{border:1px solid #cdd6cf;padding:2px 7px}
.gcur .d th{background:#eef3ef}
.hintbar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.hintbar button{border:1px solid #d8b660;background:var(--warn-l);border-radius:6px;padding:5px 10px;font-size:12.5px;color:#6b4c00}
.hintbar button:hover{background:#ffeec0}
.hintbar button:disabled{opacity:.5;cursor:default}
.hintbox{margin-top:8px;background:#fffaf0;border:1px dashed #e0b400;border-radius:6px;padding:7px 9px;font-size:12.8px;line-height:1.65}
.hintbox .lv{font-size:11px;font-weight:700;color:#8a6a00;display:block}
.alldone{text-align:center;padding:6px 0}
.alldone .big{font-size:34px}
.alldone b{display:block;font-size:15px;margin:4px 0}
.slist{margin:0;padding:0;list-style:none}
.slist li{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;font-size:12.8px;cursor:pointer;line-height:1.45}
.slist li:hover{background:#f0f2f5}
.slist li .st{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:1.5px solid #c3c9d0;color:#8a929b;background:#fff}
.slist li.ok{color:#5a6b5e}
.slist li.ok .st{background:var(--ok);border-color:var(--ok);color:#fff}
.slist li.cur{background:var(--ok-l);font-weight:700}

/* =====================================================================

(function () {

    h += '<div class="sqpn">' + (k > 0 ? '<button data-sqch="' + (k - 1) + '">‹ 上一課</button>' : '<span></span>') + '<button class="nx" data-sqch="' + (k + 1) + '">' + (k + 1 === NQ ? '小測 ›' : '下一課 ›') + '</button></div>';
    return h;
  }
  function quizHTML() {
    var q = LAB().quiz || { ans: {}, first: {} };
    var h = '<div class="sqw">W3Schools：SQL Quiz</div><h2>小測：你學會了嗎？</h2><p>選好答案後按「提交答案」。<b>以第一次提交的答案計分</b>。可以先在右邊編輯器執行 SQL 試試。</p>';
    QUIZ.forEach(function (Q, i) {

    }).join('') + '<button class="sqni' + (cur === NQ ? ' on' : '') + '" data-sqch="' + NQ + '"><span class="no">' + (quizN(A.S) === QUIZ.length ? '✔' : '?') + '</span>小測</button>';

  function tablesHTML() {
    return '<div class="sqdb"><span class="lb">資料庫：</span>' + Object.keys(DB.tables).map(function (n) {

  function resHTML() {
    var R = V.res;

      var t = DB.tables[R.tbl];

        tableGrid(t.fields.map(function (f) { return f.name; }), t.rows.map(function (r) { return t.fields.map(function (f) { return r[f.name]; }); }), t.fields.map(function (f) { return f.type; }), true);

    return m + '<div class="sqcnt">記錄數目：' + R.r.rows.length + '</div>' + tableGrid(R.r.cols, R.r.rows, R.r.types, false);

  function render(api) {
    A = api; if (!api.S) return;
    var L = LAB(), k = L.ch || 0;
    var ta = document.getElementById('sqta'), had = ta && document.activeElement === ta, ss = ta ? ta.selectionStart : 0, se = ta ? ta.selectionEnd : 0;
    var docEl = document.getElementById('sqdoc'), dst = docEl && +docEl.getAttribute('data-k') === k ? docEl.scrollTop : 0;
    if (V.res && V.res.k != null && V.res.k !== k && !V.res.tbl) V.res = null;

      '<textarea id="sqta" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="在這裏輸入 SQL，例如 SELECT * FROM 學生個人資料;">' + E(txt) + '</textarea></div>' +
      '<div class="sqbar"><button class="sqrun" data-sq="run">▶ 執行</button><button data-sq="clear">清除</button>' + (V.prev != null ? '<button data-sq="undo">↺ 還原試一試前的內容</button>' : '') + '</div></div>' +
      '<div class="sqres" id="sqres">' + resHTML() + '</div></section></div>';

    var nt = document.getElementById('sqta');
    if (nt) { var c = had ? [ss, se] : V.caret && V.caret.k === k ? V.caret.r : null; if (c) { try { nt.setSelectionRange(c[0], c[1]); } catch (e) { } } if (had) nt.focus(); }
  }
  function syncHL() { var ta = document.getElementById('sqta'), p = document.getElementById('sqhl'); if (!ta || !p) return; p.innerHTML = hl(ta.value); p.scrollTop = ta.scrollTop; p.scrollLeft = ta.scrollLeft; }
  function setText(t) { var L = LAB(), k = L.ch || 0; L.ed = L.ed || {}; L.ed[k] = t; }
  function run(fromTry) {
    var L = LAB(), k = L.ch || 0, ta = document.getElementById('sqta'), sql = ta ? ta.value : (L.ed || {})[k] || '';
    setText(sql); L.runs = L.runs || {}; L.runs[k] = (L.runs[k] || 0) + 1;
    V.tbl = null;
    if (k === NQ || fromTry) { var r0 = SQL.safeRun(DB, sql); V.res = r0.err ? { err: r0.err, k: k } : { r: r0, k: k, ex: !!fromTry }; A.log('執行 SQL（' + (k === NQ ? '小測' : '例子') + '）' + (r0.err ? '：有錯' : '')); A.render(); return; }
    var j = judge(k, sql);
    if (j.r.err) { V.res = { err: j.r.err, k: k }; A.log('執行 SQL（第 ' + (k + 1) + ' 課）：有錯 — ' + j.r.err); }
    else {
      V.res = { r: j.r, k: k, task: j.ok ? 'ok' : 'no', why: j.why };
      if (j.ok) { L.ans = L.ans || {}; L.ans[k] = sql; }
      A.log('執行 SQL（第 ' + (k + 1) + ' 課）：' + (j.ok ? '完成任務' : '未符合任務'));
    }
    A.render();
  }
  function keepCaret() { var ta = document.getElementById('sqta'); if (ta) V.caret = { k: LAB().ch || 0, r: [ta.selectionStart, ta.selectionEnd] }; }
  function insertText(s) {
    var ta = document.getElementById('sqta'); if (!ta) return;
    var c = document.activeElement === ta ? [ta.selectionStart, ta.selectionEnd] : V.caret && V.caret.k === (LAB().ch || 0) ? V.caret.r : [ta.value.length, ta.value.length];
    var a = Math.min(c[0], ta.value.length), b = Math.min(c[1], ta.value.length), v = ta.value, pre = v.slice(0, a);
    var add = (pre && !/[\s,(.]$/.test(pre) ? ' ' : '') + s;
    ta.value = pre + add + v.slice(b); var p = a + add.length; ta.focus(); ta.setSelectionRange(p, p); keepCaret();
    setText(ta.value); syncHL(); A.refresh();
  }
  function submitQuiz() {
    var L = LAB(), q = L.quiz = L.quiz || { ans: {}, first: {} }, any = false;
    QUIZ.forEach(function (Q, i) { var el = document.querySelector('input[name=sqq' + i + ']:checked'); if (el) { q.ans[i] = +el.value; if (q.first[i] == null) q.first[i] = +el.value; any = true; } });
    if (!any) { A.toast('請先選擇答案。', 'warn'); return; }
    A.log('提交小測：' + QUIZ.map(function (Q, i) { return (i + 1) + (q.first[i] == null ? '未答' : q.first[i] === Q.a ? '✔' : '✘'); }).join(' '));
    A.render();
  }
  function goCh(k) { var L = LAB(); L.ch = Math.max(0, Math.min(NQ, k)); A.render(); var d = document.getElementById('sqdoc'); if (d) d.scrollTop = 0; }
  function mount(api) {
    A = api;
    var inLab = function (e) { return A.S && A.S.info && e.target.closest && e.target.closest('#lab'); };
    document.addEventListener('click', function (e) {
      if (!inLab(e)) return;
      var t = e.target.closest('[data-sqch],[data-sqtry],[data-sq],[data-sqtbl],[data-sqins]'); if (!t) return;
      if (t.hasAttribute('data-sqch')) { goCh(+t.getAttribute('data-sqch')); return; }
      if (t.hasAttribute('data-sqtry')) {
        var p = t.getAttribute('data-sqtry').split(':'), ta = document.getElementById('sqta');
        if (ta && ta.value.trim() && V.prev == null) V.prev = ta.value;
        setText(CH[+p[0]].ex[+p[1]]); A.render(); run(true); return;
      }
      if (t.hasAttribute('data-sqtbl')) { var n = t.getAttribute('data-sqtbl'); V.tbl = V.tbl === n ? null : n; V.res = V.tbl ? { tbl: n, k: LAB().ch || 0 } : null; A.render(); return; }
      if (t.hasAttribute('data-sqins')) { insertText(t.getAttribute('data-sqins')); return; }
      var a = t.getAttribute('data-sq');
      if (a === 'run') run(false);
      else if (a === 'clear') { var ta2 = document.getElementById('sqta'); if (ta2 && ta2.value.trim()) V.prev = ta2.value; setText(''); A.render(); var t3 = document.getElementById('sqta'); if (t3) t3.focus(); }
      else if (a === 'undo') { setText(V.prev || ''); V.prev = null; A.render(); }
      else if (a === 'quiz') submitQuiz();
    });
    document.addEventListener('input', function (e) { if (e.target.id !== 'sqta' || !inLab(e)) return; setText(e.target.value); keepCaret(); if (!e.isComposing) syncHL(); A.refresh(); });
    ['keyup', 'mouseup', 'blur', 'select'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (e.target && e.target.id === 'sqta') keepCaret(); }, true); });
    document.addEventListener('scroll', function (e) { if (e.target && e.target.id === 'sqta') syncHL(); }, true);
    document.addEventListener('compositionstart', function (e) { if (e.target.id === 'sqta') document.getElementById('sqedw').classList.add('ime'); });
    document.addEventListener('compositionend', function (e) { if (e.target.id === 'sqta') { document.getElementById('sqedw').classList.remove('ime'); setText(e.target.value); syncHL(); } });
    document.addEventListener('keydown', function (e) {
      if (e.target.id !== 'sqta' || !inLab(e)) return;
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(false); }
      else if (e.key === 'Tab' && !e.isComposing) { e.preventDefault(); insertText('  '); }
    });
  }
  function init() { return { ch: 0, ed: {}, ans: {}, runs: {}, quiz: { ans: {}, first: {} } }; }

  var steps = CH.map(function (c, k) {
    return { title: '第 ' + (k + 1) + ' 課：' + c.t, detail: '在左邊目錄打開「第 ' + (k + 1) + ' 課」，看說明及例子，然後完成任務：' + c.task,
      h1: c.h1, h2: '<code>' + E(c.h2) + '</code>', check: function (S) { return taskOk(S, k); } };
  });
  steps.push({ title: '小測：4 條問題', detail: '在左邊目錄打開「小測」，回答 4 條問題後按「提交答案」。以第一次提交的答案計分。',
    h1: '可以在右邊編輯器執行第 3 題的 SQL 看看結果。', h2: '第 1 題 SELECT * FROM …；第 2 題 班別 = \'3A\'；第 3 題 只有陳明；第 4 題 DESC。',
    check: function (S) { return quizN(S) === QUIZ.length; } });

  AX.register({
    id: 'SQL1', code: 'SQL1', mode: 'practice', full: 100, fileTag: 'Access延伸SQL', subject: 'SQL', logo: '🗄️', appName: 'SQL 入門',
    title: 'Access 延伸：SQL 入門 — 用指令查詢資料庫',
    subtitle: '中三 電腦科 · 參考 W3Schools SQL Tutorial · 為高中 ICT 打好基礎',
    time: '45 分鐘',
    objectives: ['明白 SQL 是存取資料庫的標準語言，Access 的查詢背後就是 SQL', '用 SELECT、DISTINCT、WHERE、AND / OR / NOT、ORDER BY、LIKE 查詢資料', '用 COUNT、AVG 等函數及 GROUP BY 作統計', '用兩個資料表的共同欄位連接資料表'],
    intro: ['資料庫沿用 Access 單元二至單元三的「學生個人資料」「課外活動」「學生課外活動記錄」，另加「電腦科成績」。',
      '共 10 課 + 小測。每課先看說明，按「試一試 »」執行例子，然後在右邊編輯器寫 SQL 完成任務。'],
    penalty: { hint1: 1, hint2: 1, hintMax: 10, err: 0, errMax: 0 },
    rulesErr: '<b>SQL 有錯不會扣分</b>：電腦會用中文說明錯在哪裏，改正後再按「▶ 執行」便可以。結果與任務要求相同，該課便完成。',
    startMsg: '由第 1 課開始：先按「試一試 »」看看例子的結果。',
    lab: null,
    steps: steps,
    ref: function () {
      return '<h4>📘 SQL 速查</h4><pre class="sqref">' + hl('SELECT [DISTINCT] 欄位1, 欄位2\nFROM 資料表\nWHERE 條件\nGROUP BY 欄位\nORDER BY 欄位 [ASC|DESC];').replace(/\n$/, '') + '</pre>' +
        '<table class="reft" style="text-align:left"><tr><td>文字值</td><td>用單引號：\'3A\'</td></tr><tr><td>數字</td><td>不用引號：分數 &gt; 80</td></tr><tr><td>萬用字元</td><td>% 多個字元、_ 一個字元</td></tr><tr><td>函數</td><td>COUNT SUM AVG MAX MIN</td></tr></table>';
    },
    grade: function (S) {
      var L = S.lab || {}, items = [];
      CH.forEach(function (c, k) {
        var a = (L.ans || {})[k], ok = taskOk(S, k), last = (L.ed || {})[k];
        items.push({ l: '第 ' + (k + 1) + ' 課：' + c.t, y: ok ? '完成' : (last && String(last).trim() ? '未完成' : '未作答'), c: c.ref, g: ok ? c.m : 0, f: c.m, why: c.h1 });
      });
      var q = L.quiz || { first: {} };
      QUIZ.forEach(function (Q, i) { var a = (q.first || {})[i]; items.push({ l: '小測第 ' + (i + 1) + ' 題', y: a == null ? '未答' : Q.o[a], c: Q.o[Q.a], g: a === Q.a ? Q.m : 0, f: Q.m, why: Q.x }); });
      return { items: items, notes: [] };
    },
    reportExtra: function (st) {
      var L = st.lab; if (!L) return '';
      var rows = CH.map(function (c, k) { var s = (L.ans || {})[k] || (L.ed || {})[k] || ''; return s.trim() ? '<tr><td style="white-space:nowrap">第 ' + (k + 1) + ' 課</td><td style="font-family:Consolas,monospace;font-size:10.5px;text-align:left">' + AX.esc(s.replace(/\s+/g, ' ')) + '</td></tr>' : ''; }).join('');
      return rows ? '<h2>三、你寫的 SQL</h2><table class="rp-mini" style="width:100%"><tbody>' + rows + '</tbody></table>' : '';
    }
  });

  AX.CFG.SQL1.lab = {
    init: init, mount: mount, render: render,
    upgrade: function (L) { ['ed', 'ans', 'runs'].forEach(function (k) { L[k] = L[k] || {}; }); L.quiz = L.quiz || { ans: {}, first: {} }; },
    demo: CH.map(function (c, k) {
      return function (api) { A = api; var L = LAB(); L.ch = k; L.ed[k] = c.h2; A.render(); run(false); };
    }).concat([function (api) { A = api; var L = LAB(); L.ch = NQ; QUIZ.forEach(function (Q, i) { L.quiz.ans[i] = Q.a; L.quiz.first[i] = Q.a; }); A.render(); }])
  };
})();

AX.bootLab(AX.CFG['SQL1']);
</script>
